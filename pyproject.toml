[project]
name = "photos2show"
version = "0.1.0"
description = "Sort out bad holiday photos and build a slideshow by describing it, with any OpenAI-compatible vision model"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["photos", "slideshow", "image-quality", "llm", "vision", "ollama", "photo-culling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi>=0.161.0",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "openai>=1.50",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=11",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/jotiau/photos2show"
Issues = "https://github.com/jotiau/photos2show/issues"

[project.scripts]
photos2show-smoke = "photos2show.smoke:main"
photos2show-scan = "photos2show.cli:main"
photos2show-web = "photos2show.web.app:main"
photos2show-testdata = "photos2show.testdata:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
