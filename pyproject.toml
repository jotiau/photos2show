[project]
name = "imgsort"
version = "0.1.0"
description = "Presort holiday images with AI and pick a slideshow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pillow>=11",
    "python-dotenv>=1.0",
]

[project.scripts]
imgsort-smoke = "imgsort.smoke:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
