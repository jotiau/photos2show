<!doctype html>
<html lang="en" data-theme="{{ settings().theme }}" data-accent="{{ settings().accent }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>photos2show – Slideshow</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
{% include "_header.html" %}
<main class="slideshow">
{% if selection is none %}
  <p class="empty"><a href="/projects">Create a project</a> first.</p>
{% else %}
  <section class="step">
    <h2>① Describe</h2>
    <!-- collapsed to one line once there are picks; the summary is hidden while open -->
    <details class="describe" {{ 'open' if not (selection.picks and selection.description) }}>
      <summary><span class="quote">“{{ selection.description | trim }}”</span> <span class="edit">Edit</span></summary>
      <form hx-post="/slideshow/select" hx-target="#picks" hx-indicator="#thinking, #picks" hx-disabled-elt="find button"
        hx-on::after-request="collapseDescribe(this, event)">
        <label for="description">Describe the slideshow</label>
        <textarea id="description" name="description" rows="4" required
          placeholder="10-minute show for my parents, chronological, mostly landscapes and the two of us, little food">{{ selection.description }}</textarea>
        <div class="options">
          <label for="desc_size">Photo details</label>
          {% set _, choices, _, help = setting_fields.desc_size %}
          <select id="desc_size" name="desc_size" title="{{ help }}">
            {% for c in choices %}<option {{ 'selected' if c == settings().desc_size }}>{{ c }}</option>{% endfor %}
          </select>
          <a href="/settings#s-desc_size" class="more">What is this?</a>
          <button class="primary">Select photos</button>
        </div>
      </form>
    </details>
    <span id="thinking" class="htmx-indicator"><span class="spinner"></span> The AI is choosing… this can take a minute
      <span class="elapsed"></span></span>
  </section>
  <section class="step">
    <h2>② Review picks</h2>
    <div id="picks" hx-get="/slideshow/picks" hx-trigger="load"></div>
  </section>
  <dialog id="export" class="confirm">
    <form class="export" hx-post="/slideshow/export" hx-target="#export-msg">
      <h2>Export</h2>
      <label for="target">New folder, outside the photo folder</label>
      <div class="row">
        <input id="target" name="target" value="{{ default_target }}" required data-keep-name>
        <button type="button" class="browse" data-browse="target">Browse…</button>
      </div>
      <label><input type="checkbox" name="replace" value="true"> replace previous export in this folder</label>
      <p id="export-msg"></p>
      <div class="buttons">
        <button type="button" onclick="this.closest('dialog').close()">Close</button>
        <button class="primary">Export</button>
      </div>
    </form>
  </dialog>
{% endif %}
</main>
<dialog id="lightbox"></dialog>
<dialog id="player">
  <div class="stage" tabindex="-1" autofocus></div>
  <p class="reason"></p>
  <div class="controls">
    <button type="button" data-step="-1" aria-label="Previous" title="Previous (←)">⏮</button>
    <button type="button" class="hold" aria-label="Hold" title="Hold / continue (Space)">⏸</button>
    <button type="button" data-step="1" aria-label="Next" title="Next (→)">⏭</button>
    <span class="status"></span>
    <button type="button" class="end" aria-label="Close" title="Close (Esc)">✕</button>
  </div>
</dialog>
<script>
  // After Select photos: show the new description as the one-line summary and fold the form away.
  // A failed AI call still answers 200 with the error in the picks: then the form stays open.
  const collapseDescribe = (form, e) => {
    if (!e.detail.successful || e.detail.xhr.responseText.includes('class="error"')) return;
    const details = form.closest("details");
    details.querySelector(".quote").textContent = `“${form.description.value.trim()}”`;
    details.open = false;
  };
</script>
<script>
  // Elapsed time while the AI selects or refines (both forms indicate on #thinking and #picks).
  let ticker = null;
  const isAiForm = e => e.detail.elt.matches?.("form[hx-indicator]");
  document.body.addEventListener("htmx:beforeRequest", e => {
    if (!isAiForm(e)) return;
    const start = Date.now(), out = document.querySelector("#thinking .elapsed");
    const tick = () => {
      const s = Math.floor((Date.now() - start) / 1000);
      out.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    };
    tick();
    clearInterval(ticker);
    ticker = setInterval(tick, 1000);
  });
  document.body.addEventListener("htmx:afterRequest", e => isAiForm(e) && clearInterval(ticker));

  // Preview: the picks full screen in their order; photos for data-seconds, videos to their end.
  // ← → step, Space holds, Esc (or leaving full screen) ends; the control panel does the same.
  const player = document.getElementById("player"), stage = player.querySelector(".stage");
  let slides = [], at = 0, paused = false, timer = null;
  const status = () => {
    player.querySelector(".status").textContent = `${at + 1} / ${slides.length}${paused ? " · on hold" : ""}`;
    player.querySelector(".hold").textContent = paused ? "▶" : "⏸";
  };
  const hold = () => {
    paused = !paused;
    const video = stage.querySelector("video");
    if (!video) return show(at);  // restarts the photo's timer, or stops it while on hold
    paused ? video.pause() : video.play();
    status();
  };
  const show = i => {
    clearTimeout(timer);
    if (i >= slides.length) return player.close();
    at = Math.max(0, i);
    const s = slides[at];
    stage.innerHTML = s.video ? `<video src="${s.src}" autoplay></video>` : `<img src="${s.src}" alt="">`;
    // onerror: a codec this browser can't play (e.g. AVI, WMV) must not stop the preview
    if (s.video) stage.firstChild.onended = stage.firstChild.onerror = () => !paused && show(at + 1);
    else if (!paused) timer = setTimeout(() => show(at + 1), player.dataset.seconds * 1000);
    if (slides[at + 1] && !slides[at + 1].video) new Image().src = slides[at + 1].src;  // preload
    status();
    player.querySelector(".reason").textContent = s.reason;  // LLM text: never HTML
  };
  // The reason shows while the mouse moves or after a tap, then fades out.
  let infoTimer = null;
  const showInfo = () => {
    player.classList.add("info");
    clearTimeout(infoTimer);
    infoTimer = setTimeout(() => player.classList.remove("info"), 2500);
  };
  player.addEventListener("mousemove", showInfo);
  player.addEventListener("click", e => {
    showInfo();
    const button = e.target.closest(".controls button");
    if (!button) return;
    if (button.dataset.step) show(at + Number(button.dataset.step));
    else if (button.matches(".hold")) hold();
    else player.close();
  });
  // Clicks must not move the focus onto a control, or Space would press that button instead of holding.
  player.querySelector(".controls").addEventListener("mousedown", e => e.preventDefault());
  document.addEventListener("click", e => {
    const play = e.target.closest("button.play");
    if (!play) return;
    slides = [...document.querySelectorAll(".picks img[data-full]")].map(img => ({src: img.dataset.full, video: "video" in img.dataset,
      reason: img.closest("li").querySelector(".meta").textContent}));
    player.dataset.seconds = play.dataset.seconds;
    paused = false;
    player.showModal();
    player.requestFullscreen?.().catch(() => {});  // not allowed everywhere: the dialog still fills the window
    show(0);
  });
  player.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") show(at + 1);
    else if (e.key === "ArrowLeft") show(at - 1);
    else if (e.key === " " && !e.target.closest("button")) {  // a control reached by Tab: Space presses it
      e.preventDefault();
      hold();
    }
  });
  player.addEventListener("close", () => {
    clearTimeout(timer);
    stage.innerHTML = "";
    if (document.fullscreenElement) document.exitFullscreen();
  });
  document.addEventListener("fullscreenchange", () => !document.fullscreenElement && player.open && player.close());

  // Picks are swapped in by htmx, so listen on the document. ← → or the arrows step through the picks;
  // click the enlarged photo, outside it or Esc to close.
  const box = document.getElementById("lightbox");
  let boxAt = 0;
  const boxShow = i => {
    const imgs = [...document.querySelectorAll(".picks img[data-full]")];
    if (!imgs.length) return box.close();
    boxAt = Math.max(0, Math.min(imgs.length - 1, i));
    const img = imgs[boxAt];
    const media = document.createElement("video" in img.dataset ? "video" : "img");
    Object.assign(media, {src: img.dataset.full, controls: true, autoplay: true});
    const caption = document.createElement("p");  // the reason is LLM text: textContent, never HTML
    caption.textContent = `${boxAt + 1} / ${imgs.length} · ${img.closest("li").querySelector(".meta").textContent}`;
    box.replaceChildren(media, caption);
    box.insertAdjacentHTML("beforeend", '<button class="prev" aria-label="Previous">‹</button><button class="next" aria-label="Next">›</button>');
  };
  document.addEventListener("click", e => {
    const img = e.target.closest(".picks img[data-full]");
    if (img) {
      boxShow([...document.querySelectorAll(".picks img[data-full]")].indexOf(img));
      box.showModal();
    } else if (e.target.matches("#lightbox .prev, #lightbox .next")) boxShow(boxAt + (e.target.matches(".next") ? 1 : -1));
    else if (e.target === box || e.target.matches("#lightbox img")) box.close();
  });
  box.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") boxShow(boxAt + (e.key === "ArrowRight" ? 1 : -1));
  });
  box.addEventListener("close", () => box.innerHTML = "");

  // Drag and drop: tiles move live while dragging; on drop the new position is saved, on cancel the server order is reloaded.
  let dragged = null, dropped = false;
  document.addEventListener("dragstart", e => {
    dragged = e.target.closest(".picks li");
    if (!dragged) return;
    dropped = false;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragged.dataset.id);  // Firefox needs data to start a drag
    dragged.classList.add("dragging");
  });
  document.addEventListener("dragover", e => {
    if (!dragged || !e.target.closest(".picks")) return;
    e.preventDefault();
    const li = e.target.closest(".picks li");
    if (!li || li === dragged) return;
    const r = li.getBoundingClientRect();
    li.parentNode.insertBefore(dragged, e.clientX > r.left + r.width / 2 ? li.nextSibling : li);
  });
  document.addEventListener("drop", e => {
    if (dragged && e.target.closest(".picks")) { e.preventDefault(); dropped = true; }
  });
  document.addEventListener("dragend", () => {
    if (!dragged) return;
    dragged.classList.remove("dragging");
    const to = [...dragged.parentNode.children].indexOf(dragged);
    if (dropped) htmx.ajax("POST", "/slideshow/move", {target: "#picks", values: {id: dragged.dataset.id, to}});
    else htmx.ajax("GET", "/slideshow/picks", {target: "#picks"});
    dragged = null;
  });
</script>
</body>
</html>
