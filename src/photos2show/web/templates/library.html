<!doctype html>
<html lang="en" data-theme="{{ settings().theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>photos2show – Library</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <!-- Back/forward reload the URL (the server restores filter and photo) instead of caching ~1000 cards in localStorage. -->
  <meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
</head>
<body>
{% include "_header.html" %}
{% if job.folder %}
<div class="bar">
  <span class="path" title="{{ job.folder }}">{{ job.folder | basename }}</span>
  <form hx-post="/analyse" hx-target="#progress" hx-swap="outerHTML">
    <button class="primary" title="{{ settings().parallel }} parallel AI requests (see Settings)">Analyse again</button>
  </form>
  {% include "_progress.html" %}
  <input class="search" type="search" name="q" value="{{ job.query }}" placeholder="Search captions, tags, file names… (e.g. boat sunset)"
    aria-label="Search" hx-get="/grid" hx-target="#grid" hx-trigger="input changed delay:300ms, search">
</div>
<main>
  <section id="grid" hx-get="/grid" hx-trigger="load, analysed from:body"></section>
  <aside id="detail"{% if photo %} hx-get="/media/{{ photo }}" hx-trigger="load"{% endif %}></aside>
</main>
<div id="bulk" hidden>
  <span></span>
  <button data-action="add" class="primary">Add to slideshow</button>
  <button data-action="remove" class="remove">Remove from slideshow</button>
  <button data-action="">Clear</button>
</div>
<script>
  // Bulk: Ctrl/⌘-click toggles a card, Shift-click adds the range from the last one; the bar acts on all of them.
  const bulk = document.getElementById("bulk");
  const checked = () => [...document.querySelectorAll(".cards .card.checked")];
  const showBulk = () => {
    const n = checked().length;
    bulk.hidden = !n;
    bulk.querySelector("span").textContent = `${n} selected`;
  };
  let lastChecked = null;
  document.addEventListener("click", e => {
    const card = e.target.closest(".cards .card");
    if (!card || !(e.ctrlKey || e.metaKey || e.shiftKey)) return;
    e.preventDefault();  // no text selection, no detail panel
    const cards = [...document.querySelectorAll(".cards .card")];
    if (e.shiftKey && cards.includes(lastChecked)) {
      const [a, b] = [cards.indexOf(lastChecked), cards.indexOf(card)].sort((x, y) => x - y);
      cards.slice(a, b + 1).forEach(c => c.classList.add("checked"));
    } else card.classList.toggle("checked");
    lastChecked = card;
    showBulk();
  });
  bulk.addEventListener("click", e => {
    const action = e.target.closest("button")?.dataset.action;
    if (action) htmx.ajax("POST", "/slideshow/bulk", {source: bulk, swap: "none",
      values: {action, ids: checked().map(c => c.dataset.id).join(",")}});
    else if (action === "") checked().forEach(c => c.classList.remove("checked"));
    showBulk();
  });
  document.body.addEventListener("htmx:afterSwap", showBulk);  // a reloaded grid starts without a selection
</script>
<script>
  // Keyboard: ← → step through the cards in grid order, A adds the open photo to the slideshow, Esc closes.
  const detail = document.getElementById("detail");
  const openId = () => detail.querySelector("h2[data-id]")?.dataset.id;
  const mark = () => document.querySelectorAll(".cards .card").forEach(c => c.classList.toggle("selected", c.dataset.id === openId()));
  document.body.addEventListener("htmx:afterSwap", mark);  // after a click, a step or a live grid reload
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest("input, textarea, select, video")) return;
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".cards .card")) {
      e.preventDefault();  // Space would scroll the page
      e.target.click();
    } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const cards = [...document.querySelectorAll(".cards .card")];
      if (!cards.length) return;
      const open = cards.findIndex(c => c.dataset.id === openId());
      const i = open >= 0 ? open : cards.indexOf(document.activeElement);  // nothing open: from the focused card
      const next = cards[i < 0 ? 0 : Math.max(0, Math.min(cards.length - 1, i + (e.key === "ArrowRight" ? 1 : -1)))];
      e.preventDefault();
      next.focus({preventScroll: true});  // Tab goes on from here
      next.scrollIntoView({block: "nearest"});
      htmx.ajax("GET", `/media/${next.dataset.id}`, {target: "#detail"});
    } else if (e.key === "a" || e.key === "A") {
      detail.querySelector("button.add")?.click();
    } else if (e.key === "Escape" && openId()) {
      detail.innerHTML = "";
      mark();
    }
  });
</script>
{% else %}
<main><p class="empty"><a href="/projects">Create a project</a>: give it a name and the folder with your holiday photos.</p></main>
{% endif %}
</body>
</html>
