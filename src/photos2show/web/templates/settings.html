<!doctype html>
<html lang="en" data-theme="{{ settings().theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>photos2show – Settings</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
{% include "_header.html" %}
<main class="settings">
  {% for key, (label, choices, _) in fields.items() %}
  <label for="s-{{ key }}">{{ label }}</label>
  <select id="s-{{ key }}" name="value" hx-post="/settings" hx-vals='{"key": "{{ key }}"}' hx-trigger="change">
    {% for c in choices %}<option {{ 'selected' if c == settings()[key] }}>{{ c }}</option>{% endfor %}
  </select>
  {% endfor %}
</main>
</body>
</html>
