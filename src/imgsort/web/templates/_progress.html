{% if job.running %}
<div id="progress" hx-get="/progress" hx-trigger="every 500ms" hx-swap="outerHTML">
  <progress value="{{ job.done }}" max="{{ job.total or 1 }}"></progress> {{ job.done }} / {{ job.total }}
</div>
{% elif job.error %}
<div id="progress" class="error">Error: {{ job.error }}</div>
{% elif job.summary %}
<div id="progress">
  {{ job.summary.total }} files, {{ job.summary.analysed }} newly analysed
  {% for e in job.summary.errors %}<div class="error">{{ e }}</div>{% endfor %}
</div>
{% else %}
<div id="progress"></div>
{% endif %}
