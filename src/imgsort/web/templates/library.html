<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>imgsort – Library</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
{% include "_header.html" %}
{% if job.folder %}
<div class="bar">
  <span class="path">{{ job.folder }}</span>
  <button hx-post="/analyse" hx-target="#progress" hx-swap="outerHTML">Analyse again</button>
  {% include "_progress.html" %}
</div>
<main>
  <section id="grid" hx-get="/grid" hx-trigger="load, analysed from:body"></section>
  <aside id="detail"></aside>
</main>
{% else %}
<main><p class="empty">Create a project: give it a name and the folder with your holiday photos.</p></main>
{% endif %}
</body>
</html>
